vault_path: ".."
rag_dir: "."
chroma_path: "chroma_db"
manifest_path: "llama_index_manifest.json"
cache_path: "cache"
validation_path: "cache/validation"
log_path: "logs/llama_index.log"
collection_name: "obsidian_llamaindex_vault"
embedding_model: "BAAI/bge-small-en-v1.5"
chunk_size: 800
chunk_overlap: 120
top_k_default: 5
allow_rebuild_delete: false
include_globs:
  - "**/*.md"
exclude_globs:
  - ".obsidian/**"
  - ".git/**"
  - ".vault-llamaindex-rag/**"
  - ".vault-graphrag/**"
  - ".trash/**"
  - "**/.trash/**"
  - "**/attachments/**"
  - "Files/Images/**"
  - "Files/Presentations/**"
  - "**/*_exports/**"
  - "**/*exports*/**"
  - "**/node_modules/**"
  - "**/.cache/**"
  - "**/__pycache__/**"
  - "**/*.pdf"
  - "**/*.png"
  - "**/*.jpg"
  - "**/*.jpeg"
  - "**/*.gif"
  - "**/*.webp"
  - "**/*.tif"
  - "**/*.tiff"
  - "**/*.bmp"
  - "**/*.svg"
  - "**/*.drawio"
  - "**/*.excalidraw"
  - "**/*.ppt"
  - "**/*.pptx"
  - "**/*.doc"
  - "**/*.docx"
  - "**/*.xls"
  - "**/*.xlsx"
  - "**/*.zip"
  - "**/*.tar"
  - "**/*.gz"
  - "**/*.7z"

